<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <div class="flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col border-r border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <button
                    id="new-chat-btn"
                    class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                >
                    + New Chat
                </button>
            </div>
            <div id="conversations-list" class="flex-1 overflow-y-auto p-2">
                <!-- Conversations will be listed here -->
            </div>
        </aside>

        <!-- Main chat area -->
        <div class="flex-1 flex flex-col">
            <header class="bg-white shadow-md p-4 border-b">
                <h1 id="chat-title" class="text-2xl font-bold text-gray-800">AI Chatbot</h1>
                <p class="text-sm text-gray-600">Powered by Google Gemini</p>
            </header>

            <main id="message-list" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Messages will be inserted here -->
            </main>

            <footer class="flex p-4 border-t bg-white">
                <form id="chat-form" class="flex w-full gap-2">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type your message..."
                        class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        autocomplete="off"
                    />
                    <button
                        type="submit"
                        id="send-button"
                        class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-400 transition-colors"
                    >
                        Send
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <script type="module" src="src/main.ts"></script>
</body>
</html>
